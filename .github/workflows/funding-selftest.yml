name: Funding selftest (temporaneo)

# Workflow USA-E-GETTA per verificare end-to-end la catena su runner GitHub:
# preflight Bybit -> raccolta piccola -> report -> commit/push back.
# Parte su push (non serve il dispatch). Verra' rimosso dopo la verifica.

on:
  push:
    branches: [claude/bybit-funding-analysis-5b9dtt]
    paths: ['.github/workflows/funding-selftest.yml', 'funding/**']

permissions:
  contents: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install -r funding/requirements.txt

      - name: Probe reachability + raccolta piccola
        run: |
          python funding/collect.py --symbols BTCUSDT --start 2025-06-01 \
            --report funding/reports/selftest.md || true

      - name: Mostra report nel log
        run: cat funding/reports/selftest.md || echo "nessun report"

      - name: Commit/push back (prova permessi di scrittura)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add funding/reports/selftest.md
          if git diff --cached --quiet; then
            echo "niente da committare"
          else
            git commit -m "selftest: report di prova (rimuovibile)"
            git push origin HEAD:claude/bybit-funding-analysis-5b9dtt
          fi
