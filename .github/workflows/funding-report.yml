name: Funding report (Bybit)

# Lancia la raccolta funding e committa il report, cosi' lo apri da GitHub anche
# dall'iPhone (app GitHub > Actions > Run workflow per lanciare; poi il file
# funding/reports/verification-latest.md per leggere).
#
# Gira su un SELF-HOSTED RUNNER (il tuo Mac): i runner cloud GitHub sono
# geo-bloccati da Bybit, il Mac no. Vedi funding/SELF_HOSTED_RUNNER.md per il
# setup una-tantum (poi il runner gira come servizio: premi il pulsante e basta).
#
# IMPORTANTE: perche' il pulsante "Run workflow" compaia, questo file deve stare
# sul BRANCH DI DEFAULT del repo. Il report viene committato su REPORT_BRANCH.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Symbol separati da spazio (vuoto = universo di default)"
        required: false
        default: ""
      start:
        description: "Data inizio YYYY-MM-DD"
        required: false
        default: "2022-01-01"
      end:
        description: "Data fine YYYY-MM-DD (vuoto = adesso)"
        required: false
        default: ""

concurrency:
  group: funding-report
  cancel-in-progress: false

permissions:
  contents: write

env:
  REPORT_BRANCH: claude/bybit-funding-analysis-5b9dtt

jobs:
  report:
    runs-on: self-hosted   # il tuo Mac (vedi funding/SELF_HOSTED_RUNNER.md)
    steps:
      - name: Checkout branch di lavoro
        uses: actions/checkout@v4
        with:
          ref: ${{ env.REPORT_BRANCH }}
          fetch-depth: 0
          clean: false   # preserva il DuckDB locale (funding/data/) tra i run

      - name: Prepara ambiente Python (venv) + dipendenze
        run: |
          python3 -m venv .venv
          ./.venv/bin/python -m pip install -q --upgrade pip
          ./.venv/bin/pip install -q -r funding/requirements.txt

      - name: Raccolta + verifica + report
        run: |
          ARGS=""
          if [ -n "${{ inputs.start }}" ];   then ARGS="$ARGS --start ${{ inputs.start }}"; fi
          if [ -n "${{ inputs.end }}" ];     then ARGS="$ARGS --end ${{ inputs.end }}"; fi
          if [ -n "${{ inputs.symbols }}" ]; then ARGS="$ARGS --symbols ${{ inputs.symbols }}"; fi
          echo "collect.py $ARGS"
          # exit!=0 (es. buchi) NON deve fermare la pubblicazione del report
          ./.venv/bin/python funding/collect.py $ARGS || true

      - name: Committa il report sul branch di lavoro
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add funding/reports/verification-latest.md
          if git diff --cached --quiet; then
            echo "Nessuna modifica al report: niente da committare."
          else
            git commit -m "Report verifica funding (Actions, $(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push origin HEAD:${{ env.REPORT_BRANCH }}
          fi
